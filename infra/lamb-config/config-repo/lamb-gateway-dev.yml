server:
  port: 18080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:18180/realms/lamb
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
    gateway:
      server:
        webmvc:
          routes:
            - id: lms-cursos
              uri: lb://lms-ms
              predicates:
                - Path=/api/v1/cursos/**
            - id: lms-contenidos
              uri: lb://lms-ms
              predicates:
