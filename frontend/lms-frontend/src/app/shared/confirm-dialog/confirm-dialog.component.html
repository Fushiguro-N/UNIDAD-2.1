@if (confirmService.request(); as req) {
  <div class="confirm-backdrop" (click)="confirmService.respond(false)">
    <div class="confirm-panel" (click)="$event.stopPropagation()">
      <h3 class="confirm-title">{{ req.title }}</h3>
      <p class="confirm-message">{{ req.message }}</p>
      <div class="confirm-actions">
        <button type="button" class="btn-secondary" (click)="confirmService.respond(false)">{{ req.cancelText }}</button>
        <button type="button" class="btn-primary" [class.btn-danger]="req.danger" (click)="confirmService.respond(true)">{{ req.confirmText }}</button>
      </div>
    </div>
  </div>
}
