<div class="form-page">
  <h1>Registrar nuevo estudiante</h1>

  @if (error()) {
    <div class="alert-error">{{ error() }}</div>
  }

  @if (success()) {
    <div class="alert-success">
      Estudiante creado. Codigo: {{ success().codigoEstudiante }}.<br />
      Usuario: {{ success().username }} - Contrasena temporal: {{ success().temporaryPassword }}
      (debe cambiarla en el primer inicio de sesion).
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" class="dynamic-form">
    <div class="field">
      <label for="dni">DNI *</label>
      <input id="dni" type="text" formControlName="dni" maxlength="8" />
    </div>

    <div class="field">
      <label for="nombres">Nombres *</label>
      <input id="nombres" type="text" formControlName="nombres" />
    </div>

    <div class="field">
      <label for="apellidos">Apellidos *</label>
      <input id="apellidos" type="text" formControlName="apellidos" />
    </div>

    <div class="field">
      <label for="email">Correo *</label>
      <input id="email" type="email" formControlName="email" />
    </div>

    <div class="field">
      <label for="celular">Celular</label>
      <input id="celular" type="text" formControlName="celular" />
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-primary" [disabled]="saving()">
        {{ saving() ? 'Creando...' : 'Crear estudiante' }}
      </button>
    </div>
  </form>
</div>
