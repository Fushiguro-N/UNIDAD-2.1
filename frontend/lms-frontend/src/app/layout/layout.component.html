<div class="shell">
  <aside class="sidebar" [class.collapsed]="!navOpen()">
    <div class="brand">
      <span class="brand-mark">LMS</span>
      <span class="brand-name">Centro de Aprendizaje</span>
    </div>

    <nav class="nav-group">
      @for (m of modules; track m.key) {
        <a [routerLink]="m.route ?? ['/', m.key]" routerLinkActive="active" class="nav-link">{{ m.label }}</a>
      }
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" (click)="toggleNav()">☰</button>
      <div class="spacer"></div>
      <span class="username">{{ auth.fullName }}</span>
      <button class="btn-logout" (click)="logout()">Salir</button>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
