<div class="shell">
  <aside class="sidebar" [class.collapsed]="!navOpen()">
    <div class="brand">
      <span class="brand-mark">LMS</span>
      <span class="brand-name">Centro de Aprendizaje</span>
    </div>

    <nav class="nav-group">
      <a routerLink="/enrolar" routerLinkActive="active" class="nav-link special">Inscribirse</a>
      @for (e of entities; track e.resource) {
        <a [routerLink]="['/', e.resource]" routerLinkActive="active" class="nav-link">{{ e.label }}</a>
      }
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" (click)="toggleNav()">☰</button>
      <div class="spacer"></div>
      <span class="username">{{ auth.username }}</span>
      <button class="btn-logout" (click)="logout()">Salir</button>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
